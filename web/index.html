<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>香港美食地图 · 网页版（共用微信云开发数据）</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --ink:#1f2330; --sub:#6b7280; --line:#e6e8ef;
    --brand:#ff5a5f; --brand-d:#e0454a; --ok:#16a34a; --chip:#eef1f7; --star:#ffb400;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  #app{display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
  header h1{font-size:18px;margin:0;font-weight:700}
  header .logo{font-size:20px}
  header .spacer{flex:1}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;transition:.15s}
  .btn:hover{border-color:#cbd2e0}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-d)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  /* 顶部导航 */
  nav.tabs{display:flex;gap:6px;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px}
  nav.tabs button{flex:1;border:1px solid var(--line);background:#fff;color:var(--sub);padding:9px 0;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600}
  nav.tabs button.active{background:var(--brand);border-color:var(--brand);color:#fff}
  main{flex:1;min-height:0;position:relative}
  .view{position:absolute;inset:0;display:none}
  .view.active{display:flex}
  #view-map{flex-direction:row}
  #sidebar{width:340px;min-width:340px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  #map{flex:1;min-width:0;height:100%}
  .filters{padding:12px 14px;border-bottom:1px solid var(--line)}
  .filters .row{display:flex;gap:8px;margin-bottom:8px}
  .filters label{font-size:12px;color:var(--sub);display:block;margin-bottom:3px}
  .filters select,.filters input{flex:1;width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;color:var(--ink)}
  .list{flex:1;overflow:auto;padding:8px 10px}
  .card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;cursor:pointer;transition:.15s;background:#fff}
  .card:hover{border-color:#cbd2e0;box-shadow:0 2px 10px rgba(20,30,60,.06)}
  .card .name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
  .card .meta{font-size:12px;color:var(--sub);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--chip);color:#4b5563;border-radius:999px;padding:2px 9px;font-size:11px}
  .stars{color:var(--star);letter-spacing:1px}
  .card .review{font-size:13px;color:#374151;margin-top:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .empty{color:var(--sub);font-size:13px;text-align:center;padding:40px 10px}
  .banner{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;padding:8px 16px;font-size:13px;display:none}
  .searchbar{padding:12px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:8px}
  .searchbar input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
  .scroll{flex:1;overflow:auto;padding:8px 12px}
  /* Modal */
  .mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:460px;max-height:90vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal h2{margin:0 0 14px;font-size:18px}
  .modal .field{margin-bottom:12px}
  .modal label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
  .modal input,.modal select,.modal textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
  .modal textarea{resize:vertical;min-height:64px}
  .modal .close{position:absolute;top:14px;right:16px;font-size:22px;cursor:pointer;color:var(--sub);border:none;background:none}
  .modalwrap{position:relative}
  .msg{font-size:13px;padding:8px 10px;border-radius:8px;margin-bottom:10px;display:none}
  .msg.err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
  .msg.ok{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
  .rate{display:flex;gap:4px;font-size:24px}
  .rate span{cursor:pointer;color:#d1d5db;user-select:none}
  .rate span.on{color:var(--star)}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .hint{font-size:12px;color:var(--sub);margin-top:4px}
  .detail-photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .detail-photos img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .userbox{display:flex;align-items:center;gap:8px;font-size:13px}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .detail-actions{display:flex;gap:10px;margin-top:14px}
  .detail-actions .btn{flex:1}
  .detail-actions .btn.fav.on{background:var(--brand);border-color:var(--brand);color:#fff}
  #toast{position:fixed;left:50%;top:20%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:50;opacity:0;transition:.2s;pointer-events:none}
  #toast.show{opacity:1}
  @media(max-width:760px){
    #sidebar{position:absolute;z-index:6;height:100%;box-shadow:2px 0 16px rgba(0,0,0,.12)}
    #sidebar.collapsed{transform:translateX(-100%);transition:.2s}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo">🍜</span>
    <h1>香港美食地图</h1>
    <span class="spacer"></span>
    <button class="btn primary" id="addBtn" disabled>+ 添加探店</button>
    <div id="authArea"></div>
  </header>
  <nav class="tabs">
    <button data-view="map" class="active">地图</button>
    <button data-view="search">搜索</button>
    <button data-view="mine">我的探店</button>
    <button data-view="fav">收藏</button>
  </nav>
  <div class="banner" id="banner"></div>
  <main>
    <!-- 地图视图 -->
    <section class="view active" id="view-map">
      <aside id="sidebar">
        <div class="filters">
          <div class="row">
            <div style="flex:1">
              <label>地区</label>
              <select id="fDistrict"><option value="">全部</option>
                <option>香港岛</option><option>九龙</option><option>新界</option><option>离岛</option>
              </select>
            </div>
            <div style="flex:1">
              <label>菜系</label>
              <select id="fCuisine"><option value="">全部</option>
                <option>茶餐厅/冰室</option><option>烧味/烧腊</option><option>点心/早茶</option>
                <option>海鲜</option><option>火锅</option><option>粥面/粉面</option>
                <option>甜品/糖水</option><option>街头小食</option><option>异国料理</option><option>其他</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div style="flex:1">
              <label>价位（人均）</label>
              <select id="fPrice"><option value="">全部</option>
                <option>＜$50</option><option>$50–100</option><option>$100–200</option><option>$200+</option>
              </select>
            </div>
            <div style="flex:1">
              <label>最低评分</label>
              <select id="fRating"><option value="">不限</option>
                <option value="3">★★★+</option><option value="4">★★★★+</option><option value="5">★★★★★</option>
              </select>
            </div>
          </div>
        </div>
        <div class="list" id="list"></div>
      </aside>
      <div id="map"></div>
    </section>

    <!-- 搜索视图 -->
    <section class="view" id="view-search">
      <div class="searchbar">
        <input id="searchInput" placeholder="搜索店名 / 菜系 / 地址 / 推荐菜" />
      </div>
      <div class="scroll" id="searchList"></div>
    </section>

    <!-- 我的探店 -->
    <section class="view" id="view-mine">
      <div class="scroll" id="mineList"></div>
    </section>

    <!-- 收藏 -->
    <section class="view" id="view-fav">
      <div class="scroll" id="favList"></div>
    </section>
  </main>
</div>

<!-- Add Modal -->
<div class="mask" id="addMask">
  <div class="modal modalwrap">
    <button class="close" data-close="addMask">×</button>
    <h2>添加探店记录</h2>
    <div class="msg" id="addMsg"></div>
    <div class="field">
      <label>店名 *</label>
      <input id="rName" placeholder="例如：兰芳园" />
    </div>
    <div class="field">
      <label>位置 *</label>
      <input id="rAddr" placeholder="在地图上点击选点，会自动填入地址" readonly />
      <div class="hint">点击右侧地图任意位置放置标记；可手动修改地址。</div>
    </div>
    <div class="field">
      <label>评分</label>
      <div class="rate" id="rRate"><span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span></div>
    </div>
    <div class="row" style="display:flex;gap:10px">
      <div class="field" style="flex:1">
        <label>地区</label>
        <select id="rDistrict"><option value="">未知</option><option>香港岛</option><option>九龙</option><option>新界</option><option>离岛</option></select>
      </div>
      <div class="field" style="flex:1">
        <label>菜系</label>
        <select id="rCuisine"><option value="">其他</option><option>茶餐厅/冰室</option><option>烧味/烧腊</option><option>点心/早茶</option><option>海鲜</option><option>火锅</option><option>粥面/粉面</option><option>甜品/糖水</option><option>街头小食</option><option>异国料理</option></select>
      </div>
    </div>
    <div class="row" style="display:flex;gap:10px">
      <div class="field" style="flex:1">
        <label>价位（人均）</label>
        <select id="rPrice"><option value="">不详</option><option>＜$50</option><option>$50–100</option><option>$100–200</option><option>$200+</option></select>
      </div>
      <div class="field" style="flex:1">
        <label>人均消费（HK$）</label>
        <input id="rCost" type="number" min="0" placeholder="如 80" />
      </div>
    </div>
    <div class="field">
      <label>推荐菜</label>
      <input id="rDishes" placeholder="例如：丝袜奶茶、菠萝油" />
    </div>
    <div class="field">
      <label>点评</label>
      <textarea id="rReview" placeholder="环境、口味、服务……"></textarea>
    </div>
    <div class="field">
      <label>照片</label>
      <input id="rPhotos" type="file" accept="image/*" multiple />
      <div class="thumbs" id="rThumbs"></div>
      <div class="hint">上传后照片保存在云端（与小程序同一份），所有人可见。</div>
    </div>
    <button class="btn primary" style="width:100%" id="rSubmit">保存到地图</button>
  </div>
</div>

<!-- Detail Modal -->
<div class="mask" id="detailMask">
  <div class="modal modalwrap">
    <button class="close" data-close="detailMask">×</button>
    <h2 id="dName"></h2>
    <div id="dMeta" class="meta" style="font-size:12px;color:var(--sub);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px"></div>
    <div id="dReview" style="font-size:14px;line-height:1.6;color:#374151;white-space:pre-wrap"></div>
    <div class="detail-photos" id="dPhotos"></div>
    <div id="dFoot" style="margin-top:14px;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:10px"></div>
    <div class="detail-actions">
      <button class="btn" id="dCopy">📋 复制店名</button>
      <button class="btn fav" id="dFav">☆ 收藏</button>
      <button class="btn ghost" id="dDel" style="display:none">删除</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   配置（上线前按注释填写）
   - CLOUD_ENV：与「微信小程序」完全相同的微信云开发环境 ID
       （在微信开发者工具「云开发」控制台左上角查看）。
   - TMAP_KEY：腾讯地图 JavaScriptGL Key（到 https://lbs.qq.com 申请）。
       网页版地图必须填 Key（与小程序不同，小程序用原生地图组件免 Key）。
   ============================================================ */
const CLOUD_ENV = 'cloud1-d8gs9wuggcf7e20e4'   // ← 改成你的微信云开发环境 ID
const TMAP_KEY  = ''                  // ← 改成你申请的腾讯地图 Key（线上地图必需）

let tcb, auth, db, storage, map, markerLayer, pickMarker;
let records = [];
let pickLatLng = null;
let curRating = 0;
let curUid = null;
let pendingPhotos = [];   // {file, url}
let curDetail = null;     // 当前详情记录

const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showMsg(el, text, ok){ el.textContent=text; el.className='msg '+(ok?'ok':'err'); el.style.display='block'; }
function hideMsg(el){ el.style.display='none'; }
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>e.classList.remove('show'),1600); }
function fmtDate(v){
  try{
    let d = v; if(v && v.$date) d = v.$date; if(typeof v==='string') d = new Date(v);
    if(!(d instanceof Date) || isNaN(d)) return '';
    return d.toLocaleDateString('zh-HK');
  }catch(e){ return ''; }
}

/* ---------- 启动 ---------- */
async function boot(){
  try{
    await loadTMap();
    initMap();
  }catch(e){
    const b=$('banner'); b.style.display='block';
    b.textContent='地图加载失败：'+ (e.message||e) +'（网页版需配置 TMAP_KEY，见文件顶部注释）';
  }
  // 加载 CloudBase Web SDK（与小程序同一份云开发数据）
  try{
    await loadScript('https://cdn.jsdelivr.net/npm/@cloudbase/js-sdk@latest/dist/cloudbase.full.js');
    initCloud();
  }catch(e){
    const b=$('banner'); b.style.display='block';
    b.textContent='云端 SDK 加载失败：'+(e.message||e)+'（请检查网络或 CLOUD_ENV 配置）';
  }
}

function loadScript(src){
  return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('script load fail')); document.head.appendChild(s); });
}

/* ---------- 云端（微信云开发 Web SDK）---------- */
async function initCloud(){
  if(!window.cloudbase){ console.warn('cloudbase global missing'); return; }
  tcb = cloudbase.init({ env: CLOUD_ENV });
  auth = tcb.auth();
  try{
    // 匿名登录：无需注册，用于读取/写入共享数据。
    // 需在云开发控制台「登录授权」中开启「匿名登录」。
    await auth.signInAnonymously();
    curUid = auth.currentUser ? auth.currentUser.uid : null;
  }catch(e){ console.warn('匿名登录失败', e); }
  db = tcb.database();
  storage = tcb.storage();

  renderUser();
  await loadRecords();
  await loadFavIds();   // 预取收藏集合，供详情按钮显示状态
}

function renderUser(){
  const a=$('authArea');
  if(curUid){
    a.innerHTML='<div class="userbox"><div class="avatar">网</div><span>网页用户</span></div>';
    $('addBtn').disabled=false;
  }else{
    a.innerHTML='<span class="muted" style="font-size:13px">未登录</span>';
    $('addBtn').disabled=true;
  }
}

/* ---------- 数据加载（全部记录，地图+列表）---------- */
async function loadRecords(){
  if(!db) return;
  try{
    let q = db.collection('restaurants').orderBy('created_at','desc');
    const d=$('fDistrict').value, c=$('fCuisine').value, p=$('fPrice').value, rt=$('fRating').value;
    const where={};
    if(d) where.district=d;
    if(c) where.cuisine=c;
    if(p) where.price_level=p;
    if(rt) where.rating = db.command.gte(Number(rt));
    if(Object.keys(where).length) q = q.where(where);
    const { data } = await q.get();
    records = (data||[]).map(r=>({ ...r, id: r._id }));
    renderMarkers(); renderList(records, 'list');
  }catch(e){ console.warn('load fail', e); }
}

function renderMarkers(){
  if(!markerLayer) return;
  markerLayer.setGeometries(records.map(r=>({
    id:String(r.id), styleId:'shop', position:new TMap.LatLng(r.lat, r.lng), properties:{ name:r.name }
  })));
}

function cardHTML(r){
  const star = r.rating ? '★'.repeat(r.rating)+'☆'.repeat(5-r.rating) : '';
  return `<div class="card" data-id="${r.id}">
    <div class="name">${esc(r.name)} ${star?`<span class="stars">${star}</span>`:''}</div>
    <div class="meta">
      ${r.district?`<span class="chip">${esc(r.district)}</span>`:''}
      ${r.cuisine?`<span class="chip">${esc(r.cuisine)}</span>`:''}
      ${r.price_level?`<span class="chip">${esc(r.price_level)}</span>`:''}
    </div>
    ${r.review?`<div class="review">${esc(r.review)}</div>`:''}
  </div>`;
}
function bindCards(el){
  el.querySelectorAll('.card').forEach(c=>c.onclick=()=>{
    const r=records.find(x=>String(x.id)===c.dataset.id); if(r){ openDetail(r); flyTo(r); }
  });
}
function renderList(arr, id){
  const el=$(id);
  if(!arr.length){ el.innerHTML='<div class="empty">还没有记录，点右上角“添加探店”分享第一家店吧！</div>'; return; }
  el.innerHTML = arr.map(cardHTML).join('');
  bindCards(el);
}
function flyTo(r){ if(map) map.setCenter(new TMap.LatLng(r.lat,r.lng)); }

/* ---------- 收藏集合（预取当前用户收藏的 id 集合）---------- */
let favIdSet = new Set();
async function loadFavIds(){
  if(!db || !curUid) return;
  try{
    const { data } = await db.collection('favorites').get();
    favIdSet = new Set((data||[]).map(f=>String(f.spot_id)));
  }catch(e){ /* 权限不足时忽略 */ }
}

/* ---------- 详情 ---------- */
async function openDetail(r){
  curDetail = r;
  $('dName').textContent = r.name||'未命名';
  const meta=[];
  if(r.rating) meta.push('<span class="stars">'+'★'.repeat(r.rating)+'☆'.repeat(5-r.rating)+'</span>');
  if(r.district) meta.push('<span class="chip">'+esc(r.district)+'</span>');
  if(r.cuisine) meta.push('<span class="chip">'+esc(r.cuisine)+'</span>');
  if(r.price_level) meta.push('<span class="chip">'+esc(r.price_level)+'</span>');
  if(r.avg_cost) meta.push('<span class="chip">人均 $'+esc(String(r.avg_cost))+'</span>');
  $('dMeta').innerHTML = meta.join('');
  let body='';
  if(r.address) body+='📍 '+esc(r.address)+'\n';
  if(r.recommended_dishes) body+='🍽 推荐：'+esc(r.recommended_dishes)+'\n';
  if(r.review) body+='\n'+esc(r.review);
  $('dReview').textContent = body.trim();
  // 照片（云存储临时链接，与小程序同一份）
  const dp=$('dPhotos'); dp.innerHTML='加载照片中…';
  if(r.photo_paths && r.photo_paths.length && storage){
    try{
      const { fileList } = await storage.getTempFileURL({ fileList: r.photo_paths });
      dp.innerHTML = (fileList||[]).map(x=>`<img src="${x.tempFileURL}" loading="lazy" onclick="window.open(this.src)"/>`).join('');
    }catch(e){ dp.innerHTML='<span style="color:#b91c1c;font-size:12px">照片加载失败</span>'; }
  } else dp.innerHTML='';
  $('dFoot').innerHTML = '<span>by '+(r.owner_name||'匿名')+' · '+fmtDate(r.created_at)+'</span>';
  // 收藏状态
  const favOn = favIdSet.has(String(r.id));
  const dFav=$('dFav'); dFav.className='btn fav'+(favOn?' on':''); dFav.textContent = favOn?'★ 已收藏':'☆ 收藏';
  // 删除（仅本人）
  $('dDel').style.display = (curUid && r.owner_id===curUid) ? '' : 'none';
  $('detailMask').classList.add('show');
}

function copyName(){
  if(!curDetail) return;
  const s=curDetail, text = s.address ? `${s.name}\n${s.address}` : s.name;
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>toast('店名已复制，去任意地图 App 粘贴导航')).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('店名已复制，去任意地图 App 粘贴导航'); }catch(e){ toast('复制失败'); }
  document.body.removeChild(ta);
}

async function toggleFav(){
  if(!curUid){ toast('请先登录'); return; }
  if(!curDetail) return;
  const id=curDetail.id;
  try{
    if(favIdSet.has(String(id))){
      const { data } = await db.collection('favorites').where({ spot_id: id }).get();
      if(data && data.length) await db.collection('favorites').doc(data[0]._id).remove();
      favIdSet.delete(String(id)); toast('已取消收藏');
    }else{
      await db.collection('favorites').add({ spot_id: id });
      favIdSet.add(String(id)); toast('已收藏');
    }
    const favOn=favIdSet.has(String(id));
    const dFav=$('dFav'); dFav.className='btn fav'+(favOn?' on':''); dFav.textContent=favOn?'★ 已收藏':'☆ 收藏';
    if(currentView==='fav') loadFavView();
  }catch(e){ toast('操作失败：'+(e.message||e)); }
}

async function removeRecord(){
  if(!curDetail) return;
  if(!confirm('确定删除「'+curDetail.name+'」这条探店记录？')) return;
  try{
    await db.collection('restaurants').doc(curDetail.id).remove();
    $('detailMask').classList.remove('show');
    await loadRecords();
  }catch(e){ toast('删除失败：'+(e.message||e)); }
}

/* ---------- 添加 ---------- */
function setPick(latLng){
  pickLatLng=latLng;
  if(!pickMarker){
    pickMarker=new TMap.MultiMarker({ map, styles:{ pick:new TMap.MarkerStyle({ width:26,height:34,anchor:{x:13,y:34},
      src:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="26" height="34"><path d="M13 0C5.8 0 0 5.6 0 12.6 0 22 13 34 13 34s13-12 13-21.4C26 5.6 20.2 0 13 0z" fill="%232563eb"/><circle cx="13" cy="12.5" r="5" fill="%23fff"/></svg>') }) },
      geometries:[] });
  }
  pickMarker.setGeometries([{ id:'pick', styleId:'pick', position:latLng }]);
  try{
    const g=new TMap.service.Geocoder();
    const res=await g.reverseGeocode({ location:latLng });
    const ac=res.result.address_component||{};
    $('rAddr').value=res.result.address||'';
    $('rDistrict').value=mapDistrict(ac.district||ac.city||'')||'';
  }catch(e){ /* 忽略逆编码失败 */ }
}
function mapDistrict(fine){
  if(/中西|湾仔|东[区]|南[区]/.test(fine)) return '香港岛';
  if(/油尖旺|深水埗|九龙城|观塘|黄大仙/.test(fine)) return '九龙';
  if(/离岛/.test(fine)) return '离岛';
  if(/葵青|荃湾|屯门|元朗|北[区]|大埔|沙田|西贡/.test(fine)) return '新界';
  return '';
}

async function uploadPhotos(){
  const paths=[];
  for(const p of pendingPhotos){
    const ext=(p.file.name.match(/\.\w+$/)||['.jpg'])[0];
    const cloudPath='restaurants/'+Date.now()+'-'+Math.random().toString(36).slice(2)+ext;
    const res=await storage.uploadFile({ cloudPath, filePath: p.file });
    const fileID = res.fileID || (res.data&&res.data.fileID);
    if(fileID) paths.push(fileID);
  }
  return paths;
}

async function submitRecord(){
  hideMsg($('addMsg'));
  if(!curUid){ toast('请先登录'); return; }
  const name=$('rName').value.trim();
  if(!name){ showMsg($('addMsg'),'请填写店名'); return; }
  if(!pickLatLng){ showMsg($('addMsg'),'请在地图上点击选点'); return; }
  const btn=$('rSubmit'); btn.disabled=true; btn.textContent='保存中…';
  try{
    const paths=await uploadPhotos();
    const { id, _id } = await db.collection('restaurants').add({
      owner_name: '网页用户',
      owner_id: curUid,
      name,
      lat: pickLatLng.getLat(), lng: pickLatLng.getLng(),
      address: $('rAddr').value.trim(),
      district: $('rDistrict').value||null,
      cuisine: $('rCuisine').value||null,
      price_level: $('rPrice').value||null,
      avg_cost: $('rCost').value? Number($('rCost').value):null,
      rating: curRating||null,
      review: $('rReview').value.trim()||null,
      recommended_dishes: $('rDishes').value.trim()||null,
      photo_paths: paths.length?paths:null,
      created_at: new Date()
    });
    const newId = id || _id;
    $('addMask').classList.remove('show');
    resetAddForm();
    await loadRecords();
    if(newId){ const r=records.find(x=>String(x.id)===String(newId)); if(r) openDetail(r); }
  }catch(e){
    showMsg($('addMsg'),'保存失败：'+(e.message||e));
  }finally{ btn.disabled=false; btn.textContent='保存到地图'; }
}

function resetAddForm(){
  ['rName','rAddr','rCost','rDishes','rReview'].forEach(i=>$(i).value='');
  $('rDistrict').value=''; $('rCuisine').value=''; $('rPrice').value='';
  curRating=0; updateRate(); pickLatLng=null; pendingPhotos=[];
  if(pickMarker) pickMarker.setGeometries([]);
  $('rThumbs').innerHTML='';
}

/* ---------- 评分星 ---------- */
function updateRate(){ document.querySelectorAll('#rRate span').forEach(s=>s.classList.toggle('on', Number(s.dataset.v)<=curRating)); }
document.querySelectorAll('#rRate span').forEach(s=>s.onclick=()=>{ curRating=Number(s.dataset.v); updateRate(); });

/* ---------- 照片预览 ---------- */
$('rPhotos').onchange=()=>{
  const files=[...$('rPhotos').files];
  files.forEach(f=>{ const url=URL.createObjectURL(f); pendingPhotos.push({file,url}); });
  $('rThumbs').innerHTML=pendingPhotos.map(p=>`<img src="${p.url}"/>`).join('');
  $('rPhotos').value='';
};

/* ---------- 地图 ---------- */
function loadTMap(){
  return new Promise((resolve,reject)=>{
    if(window.TMap) return resolve();
    if(!TMAP_KEY){ return reject(new Error('未配置 TMAP_KEY')); }
    const s=document.createElement('script');
    s.src='https://map.qq.com/api/gljs?v=1.exp&key='+encodeURIComponent(TMAP_KEY)+'&libraries=service';
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error('地图脚本加载失败'));
    document.head.appendChild(s);
  });
}
function initMap(){
  map = new TMap.Map('map',{ zoom:12, center:new TMap.LatLng(22.3193,114.1694) });
  markerLayer = new TMap.MultiMarker({
    map,
    styles:{ shop:new TMap.MarkerStyle({ width:26, height:34, anchor:{x:13,y:34},
      src:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="26" height="34"><path d="M13 0C5.8 0 0 5.6 0 12.6 0 22 13 34 13 34s13-12 13-21.4C26 5.6 20.2 0 13 0z" fill="%23ff5a5f"/><circle cx="13" cy="12.5" r="5" fill="%23fff"/></svg>') }) },
    geometries:[]
  });
  markerLayer.on('click', e=>{ const r=records.find(x=>String(x.id)===String(e.geometry.id)); if(r) openDetail(r); });
  map.on('click', e=>{ if($('addMask').classList.contains('show')) setPick(e.latLng); });
}

/* ---------- 视图切换 ---------- */
let currentView='map';
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{
  const v=b.dataset.view; currentView=v;
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('active', x===b));
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('active', s.id==='view-'+v));
  if(v==='search') loadSearchView();
  if(v==='mine') loadMineView();
  if(v==='fav') loadFavView();
});

/* ---------- 搜索视图 ---------- */
async function loadSearchView(){
  const kw=$('searchInput').value.trim();
  const el=$('searchList');
  if(!kw){ el.innerHTML='<div class="empty">输入关键词开始搜索（店名/菜系/地址/推荐菜）</div>'; return; }
  if(!db){ el.innerHTML='<div class="empty">云端未连接</div>'; return; }
  try{
    const reg=db.RegExp({ regexp: kw, options: 'i' });
    const { data } = await db.collection('restaurants').where(db.command.or([
      { name: reg }, { cuisine: reg }, { address: reg }, { recommendedDishes: reg }, { review: reg }
    ])).limit(50).get();
    renderList((data||[]).map(r=>({...r,id:r._id})), 'searchList');
  }catch(e){ el.innerHTML='<div class="empty">搜索失败：'+(e.message||e)+'</div>'; }
}
$('searchInput').oninput=()=>loadSearchView();

/* ---------- 我的探店 ---------- */
async function loadMineView(){
  const el=$('mineList');
  if(!curUid){ el.innerHTML='<div class="empty">未登录，无法查看</div>'; return; }
  try{
    const { data } = await db.collection('restaurants').where({ owner_id: curUid }).orderBy('created_at','desc').get();
    renderList((data||[]).map(r=>({...r,id:r._id})), 'mineList');
  }catch(e){ el.innerHTML='<div class="empty">加载失败：'+(e.message||e)+'</div>'; }
}

/* ---------- 收藏 ---------- */
async function loadFavView(){
  const el=$('favList');
  if(!curUid){ el.innerHTML='<div class="empty">未登录，无法查看</div>'; return; }
  try{
    const fr = await db.collection('favorites').get();
    const ids=(fr.data||[]).map(f=>f.spot_id);
    if(!ids.length){ el.innerHTML='<div class="empty">还没有收藏，去店铺详情点「☆ 收藏」</div>'; return; }
    const { data } = await db.collection('restaurants').where({ _id: db.command.in(ids) }).get();
    renderList((data||[]).map(r=>({...r,id:r._id})), 'favList');
  }catch(e){ el.innerHTML='<div class="empty">加载失败：'+(e.message||e)+'</div>'; }
}

/* ---------- 事件绑定 ---------- */
$('addBtn').onclick=()=>{ if(!curUid){ toast('请先登录'); return; } resetAddForm(); $('addMask').classList.add('show'); };
$('rSubmit').onclick=submitRecord;
$('dCopy').onclick=copyName;
$('dFav').onclick=toggleFav;
$('dDel').onclick=removeRecord;
['fDistrict','fCuisine','fPrice','fRating'].forEach(id=>$(id).onchange=loadRecords);
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove('show'));
document.querySelectorAll('.mask').forEach(m=>m.onclick=e=>{ if(e.target===m) m.classList.remove('show'); });

boot();
</script>
